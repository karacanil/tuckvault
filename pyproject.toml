[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuckvault"
description = "Small automatic, encrypted, verified backups from Windows or Linux to another computer or drive"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cryptography>=42"]
dynamic = ["version"]

[project.scripts]
tuckvault = "tuckvault.__main__:main"

[project.gui-scripts]
tuckvault-gui = "tuckvault.gui:main"

[tool.setuptools]
packages = ["tuckvault"]

[tool.setuptools.dynamic]
version = { attr = "tuckvault.__version__" }

[tool.setuptools.package-data]
tuckvault = ["assets/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
