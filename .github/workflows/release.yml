name: Release

# Pushing a tag like v1.1.0 tests, builds, checks and publishes that version:
# an installer, a portable zip and their SHA-256 checksums on a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: The tag must match the version in the code
        shell: pwsh
        run: |
          $version = python -c "import tuckvault; print(tuckvault.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match tuckvault.__version__ $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Security checks
        run: |
          python -m bandit -q -r tuckvault -ll
          python -m pip_audit -r requirements.txt

      - name: Build the app
        run: python -m PyInstaller --noconfirm --clean --log-level WARN packaging/tuckvault.spec
      - name: Check the built app works
        run: python tools/smoke_test_build.py dist/Tuckvault

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Tuckvault -DestinationPath "dist/Tuckvault-$env:VERSION-windows-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Check the installer installs, works and uninstalls
        shell: pwsh
        run: |
          $setup = "dist\Tuckvault-$env:VERSION-setup.exe"
          $target = "$env:RUNNER_TEMP\TuckvaultInstalled"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait
          python tools/smoke_test_build.py $target
          if ($LASTEXITCODE -ne 0) { throw "installed app failed the smoke test" }
          Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep 3
          if (Test-Path "$target\Tuckvault.exe") { throw "uninstall left the program behind" }

      - name: Linux download (source and install script)
        shell: pwsh
        run: git archive --format=tar.gz --prefix="tuckvault-$env:VERSION/" -o "dist/Tuckvault-$env:VERSION-linux.tar.gz" HEAD

      - name: Checksums
        shell: pwsh
        run: |
          Set-Location dist
          # Unix line endings, so "sha256sum -c" accepts the file as well
          $lines = Get-ChildItem "Tuckvault-$env:VERSION-*" | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Release notes from the changelog
        shell: pwsh
        run: python tools/release_notes.py $env:VERSION > "$env:RUNNER_TEMP\notes.md"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Tuckvault-$env:VERSION-setup.exe" `
            "dist/Tuckvault-$env:VERSION-windows-portable.zip" `
            "dist/Tuckvault-$env:VERSION-linux.tar.gz" `
            "dist/SHA256SUMS.txt" `
            --title "Tuckvault $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" --verify-tag
