name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Static security scan (medium and above fail the build)
        run: python -m bandit -q -r tuckvault -ll
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements.txt

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          python -m pip install -r requirements.txt bandit==1.9.4
      - name: Tests (the window tests run on a virtual display)
        run: xvfb-run -a python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Static security scan (medium and above fail the build)
        run: python -m bandit -q -r tuckvault -ll
      - name: The install script installs and uninstalls
        run: |
          sh tools/install-linux.sh
          ~/.local/bin/tuckvault --help
          sh tools/install-linux.sh --uninstall
          test ! -e ~/.local/bin/tuckvault
