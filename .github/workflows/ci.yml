name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Static security scan (medium and above fail the build)
        run: python -m bandit -q -r safekeep -ll
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements.txt
