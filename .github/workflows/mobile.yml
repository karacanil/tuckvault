name: Mobile

# The phone app (mobile/) and everything it depends on in the PC program.
on:
  push:
    branches: [main]
    paths: ["mobile/**", "tuckvault/**", "tools/make_mobile_vectors.py", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "tuckvault/**", "tools/make_mobile_vectors.py", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  engine:
    name: Backup engine against the real receiver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Types
        run: npm run typecheck
        working-directory: mobile
      - name: The app's engine backs up to `tuckvault serve`; the PC restores it
        run: npm test
        working-directory: mobile
        env:
          TUCKVAULT_PYTHON: python

  android:
    name: Android build and run on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: python -m pip install -r requirements.txt pillow==13.0.0
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Storage format tests (Kotlin, against the PC's vectors)
        run: ./gradlew :tuckvault-core:testDebugUnitTest --console=plain
        working-directory: mobile/android
      - name: Build the app
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --console=plain
        working-directory: mobile/android
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up, back up, restore and check on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python mobile/e2e/run_android.py --scan --apk mobile/android/app/build/outputs/apk/release/app-release.apk --shots e2e-shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-screenshots
          path: e2e-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-test-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  ios:
    name: iOS build and run in a simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Storage format tests (Swift, against the PC's vectors)
        working-directory: mobile/modules/tuckvault-core/swift-tests
        run: |
          cp ../ios/Vault.swift Sources/Vault/
          swift test
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios
        working-directory: mobile
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      # Signed "to run locally" (no account needed): without any signature the simulator
      # refuses the app access to the keychain, where the backup key is kept.
      - name: Build the app for the simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Tuckvault.xcworkspace -scheme Tuckvault -configuration Release \
            -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -n 60
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools for the simulator test
        run: |
          python -m pip install -r requirements.txt pillow==13.0.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Set up, back up and restore in the simulator; the PC restores it too
        env:
          PYTHON: python
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" mobile/ios/build/Build/Products/Release-iphonesimulator/Tuckvault.app
          bash mobile/e2e/run_ios.sh "$PWD/ios-shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-screenshots
          path: ios-shots
          if-no-files-found: ignore

  ios-expo-go:
    name: iOS inside Expo Go, in a simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tools for the simulator test
        run: |
          python -m pip install -r requirements.txt pillow==13.0.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Pick a simulator and put Expo Go on it
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          URL=$(curl -fsSL https://api.expo.dev/v2/versions/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['sdkVersions']['58.0.0']['iosClientUrl'])")
          mkdir -p "$RUNNER_TEMP/Expo Go.app"
          curl -fsSL "$URL" | tar -xz -C "$RUNNER_TEMP/Expo Go.app"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/Expo Go.app"
      - name: Set up, back up and restore inside Expo Go; the PC restores it too
        env:
          PYTHON: python
          MAESTRO_CLI_NO_ANALYTICS: "1"
          CI: "1"
          EXPO_GO_LINK: exp://127.0.0.1:8093
        run: |
          (cd mobile && npx expo start --go --port 8093 > "$RUNNER_TEMP/metro.log" 2>&1 &)
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8093/status > /dev/null && break; sleep 2; done
          # Build the very bundle the app will ask for now (its address is in the manifest). Expo Go gives up
          # on a bundle that takes minutes, and one built with other options is of no use to it.
          BUNDLE=$(curl -fsS -H "expo-platform: ios" -H "accept: application/expo+json,application/json" http://127.0.0.1:8093/ | python3 -c "import re,sys; m = re.search(r'\"url\":\"(http[^\"]*entry\.bundle[^\"]*)\"', sys.stdin.read()); print(m.group(1) if m else '')" || true)
          [ -n "$BUNDLE" ] || BUNDLE="http://127.0.0.1:8093/node_modules/expo-router/entry.bundle?platform=ios&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=src%2Fapp&unstable_transformProfile=hermes-stable"
          echo "building $BUNDLE"
          curl -fsS -m 900 -o /dev/null "$BUNDLE" || true
          bash mobile/e2e/run_ios.sh "$PWD/ios-go-shots" || { tail -n 60 "$RUNNER_TEMP/metro.log"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-expo-go-screenshots
          path: ios-go-shots
          if-no-files-found: ignore
